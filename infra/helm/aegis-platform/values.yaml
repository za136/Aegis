global:
  environment: production
  domain: meridian.bank
  tlsSecretName: meridian-wildcard-tls

namespaces:
  core: meridian-core
  agents: meridian-agent-platform
  simulators: meridian-simulators

apiGateway:
  replicaCount: 2
  image:
    repository: aegis/api-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    GEMINI_MODEL: gemini-3.8-flash
    GEMINI_EMBEDDING_MODEL: text-embedding-004
    TOOL_GATEWAY_DEFAULT_AUTONOMY: A1
    MAX_AUTONOMOUS_TRANSFER_LIMIT_USD: "100.00"
    REPAIR_AUTO_THRESHOLD_USD: "250.00"

customerPortal:
  replicaCount: 2
  image:
    repository: aegis/customer-portal
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

opsConsole:
  replicaCount: 2
  image:
    repository: aegis/ops-console
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

database:
  host: postgres.meridian-core.svc.cluster.local
  port: 5432
  name: aegis_meridian
  user: aegis

redis:
  host: redis.meridian-core.svc.cluster.local
  port: 6379

eventBus:
  bootstrapServers: redpanda.meridian-core.svc.cluster.local:9092
  schemaRegistryUrl: http://redpanda.meridian-core.svc.cluster.local:8081

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
