apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-meridian-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/meridian-bank/aegis-platform.git
    targetRevision: HEAD
    path: infra/helm/aegis-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: meridian-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
